<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dither Blur Carousel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:grab}body.drag{cursor:grabbing}.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,#171717 0,#080808 38%,#000 75%)}.grain{position:absolute;inset:-50%;opacity:.12;pointer-events:none;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:5px 5px;mix-blend-mode:screen}.carousel{position:relative;width:min(76vw,1100px);height:min(42vw,620px);perspective:1300px;transform-style:preserve-3d}.card{--i:0;position:absolute;left:50%;top:50%;width:min(30vw,420px);aspect-ratio:2/1;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateY(calc((var(--i) - var(--active))*22deg)) translateZ(calc(cos((var(--i) - var(--active))*22deg)*430px)) translateX(calc(sin((var(--i) - var(--active))*22deg)*430px));transition:transform .72s cubic-bezier(.16,.8,.2,1),filter .72s,opacity .72s;filter:blur(calc(min(abs(var(--i) - var(--active)),5)*1.5px)) saturate(.8);opacity:calc(1 - min(abs(var(--i) - var(--active))*.13,.72));overflow:hidden;border:1px solid rgba(255,255,255,.2);background:#111;box-shadow:0 20px 80px rgba(0,0,0,.7)}.card.active{filter:none;opacity:1}.art{position:absolute;inset:0;background:var(--bg);overflow:hidden}.art:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:5px 5px;opacity:.18;mix-blend-mode:screen}.orb{position:absolute;border-radius:50%;filter:blur(2px);mix-blend-mode:screen}.o1{width:45%;aspect-ratio:1;left:8%;top:10%;background:#fff;box-shadow:0 0 80px #fff}.o2{width:28%;aspect-ratio:1;right:9%;bottom:8%;background:#888;box-shadow:0 0 90px #aaa}.ring{position:absolute;width:65%;aspect-ratio:1;left:18%;top:18%;border:3px solid rgba(255,255,255,.7);border-radius:50%;transform:rotateX(68deg);box-shadow:0 0 50px rgba(255,255,255,.2)}.label{position:absolute;left:18px;bottom:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;z-index:2}.title{position:fixed;left:24px;top:20px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;z-index:5}.hint{position:fixed;right:20px;top:20px;font-size:11px;opacity:.45;z-index:5}.projects{position:fixed;right:0;bottom:8px;width:210px;z-index:5;font-size:13px;font-weight:600}.projects div{padding:3px 8px;line-height:1}.projects .on{background:#fff;color:#000}.center{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:.35;box-shadow:0 0 25px #fff}
@media(max-width:700px){.carousel{width:92vw;height:55vw}.card{width:54vw;transform:translate(-50%,-50%) rotateY(calc((var(--i) - var(--active))*26deg)) translateZ(calc(cos((var(--i) - var(--active))*26deg)*260px)) translateX(calc(sin((var(--i) - var(--active))*26deg)*260px))}.projects{width:150px;font-size:10px}.hint{display:none}}
</style>
</head>
<body>
<div class="stage"><div class="grain"></div><div class="title">DITHER / BLUR</div><div class="hint">WHEEL · DRAG · CLICK</div><div class="carousel" id="carousel"><div class="center"></div></div><div class="projects" id="projects"></div></div>
<script>
const names=['Pacekeeper','Nocturne Radio','Aurelia Objects','Granite Capital','Encore Live','Turfline','Kinesis Festival','Volta Mobility','Redshift Agency','Cobalt Card','Highsign Studio','Monochrome Supply'];
const palettes=[['#111','#777'],['#0d1b2a','#778da9'],['#161616','#ddd'],['#181818','#777'],['#101010','#bbb'],['#161616','#666'],['#0b0b0b','#aaa'],['#111','#888'],['#141414','#ccc'],['#090909','#777'],['#151515','#aaa'],['#101010','#ddd']];
const root=document.documentElement, carousel=document.getElementById('carousel'), list=document.getElementById('projects');
let active=0,drag=false,startX=0,startA=0;
for(let i=0;i<names.length;i++){
 const c=document.createElement('div');c.className='card';c.style.setProperty('--i',i);c.dataset.i=i;
 const a=document.createElement('div');a.className='art';a.style.setProperty('--bg',`radial-gradient(circle at ${20+i*7}% ${30+(i%4)*12}%, ${palettes[i][1]} 0, transparent 27%), radial-gradient(circle at ${75-(i%3)*9}% ${65+(i%2)*8}%, #333 0, transparent 30%), linear-gradient(135deg,${palettes[i][0]},#050505)`);
 a.innerHTML='<span class="orb o1"></span><span class="orb o2"></span><span class="ring"></span><span class="label">'+String(i+1).padStart(2,'0')+'</span>';
 c.appendChild(a);carousel.appendChild(c);c.addEventListener('click',()=>{active=i;render()});
 const p=document.createElement('div');p.textContent=names[i];p.dataset.i=i;p.onclick=()=>{active=i;render()};list.appendChild(p);
}
function render(){root.style.setProperty('--active',active);document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('active',i===active));document.querySelectorAll('.projects div').forEach((p,i)=>p.classList.toggle('on',i===active));}
function step(n){active=(active+n+names.length)%names.length;render()}
window.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')step(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(-1)});
window.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startA=active;document.body.classList.add('drag')});
window.addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-startX;if(Math.abs(d)>45){const n=Math.round(-d/80);active=(startA+n+names.length*10)%names.length;render()}});
window.addEventListener('pointerup',()=>{drag=false;document.body.classList.remove('drag')});
render();
</script>
</body></html>
