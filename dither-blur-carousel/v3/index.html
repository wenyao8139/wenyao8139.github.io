<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dither Blur Carousel V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}.wrap{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#333 0,#0a0a0a 38%,#000 75%)}.carousel{width:78vw;height:60vh;position:relative;perspective:1400px;transform-style:preserve-3d}.card{position:absolute;left:50%;top:50%;width:min(390px,30vw);aspect-ratio:2/1;transform:translate(-50%,-50%) rotateY(calc((var(--i) - var(--a))*20deg)) translateZ(calc(cos((var(--i) - var(--a))*20deg)*420px)) translateX(calc(sin((var(--i) - var(--a))*20deg)*420px));transition:.8s cubic-bezier(.15,.8,.2,1);filter:blur(calc(min(abs(var(--i) - var(--a)),5)*1.4px));opacity:calc(1 - min(abs(var(--i) - var(--a))*.12,.7))}.card.on{filter:none;opacity:1}.face{height:100%;position:relative;overflow:hidden;border:1px solid #555;background:linear-gradient(135deg,var(--c),#080808);box-shadow:0 25px 90px #000}.face:before{content:"";position:absolute;width:130%;height:130%;left:-15%;top:-15%;background:radial-gradient(circle at 30% 35%,#fff 0,transparent 14%),radial-gradient(circle at 72% 68%,#777 0,transparent 22%);filter:blur(12px);animation:f 7s ease-in-out infinite alternate}.face:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff .7px,transparent .8px);background-size:5px 5px;opacity:.2}@keyframes f{to{transform:translate(5%,-4%) scale(1.15)}}.num{position:absolute;z-index:2;left:14px;bottom:10px;font:11px monospace;letter-spacing:.2em}.ui{position:fixed;z-index:5;top:18px;left:20px;font-size:11px;letter-spacing:.2em}.right{left:auto;right:20px;opacity:.45}.list{position:fixed;right:0;bottom:8px;width:210px;font-size:12px;font-weight:bold}.list div{padding:3px 8px}.list .on{background:#fff;color:#000}</style></head><body><div class="wrap"><div class="ui">DITHER / BLUR</div><div class="ui right">WHEEL · DRAG · CLICK</div><div class="carousel" id="c"></div><div class="list" id="l"></div></div><script>const n=['Pacekeeper','Nocturne Radio','Aurelia Objects','Granite Capital','Encore Live','Turfline','Kinesis Festival','Volta Mobility','Redshift Agency','Cobalt Card','Highsign Studio','Monochrome Supply'],root=document.documentElement,c=document.querySelector('#c'),l=document.querySelector('#l');let a=0,down=0,x=0,s=0;n.forEach((name,i)=>{let d=document.createElement('div');d.className='card';d.style.setProperty('--i',i);let f=document.createElement('div');f.className='face';f.style.setProperty('--c',`hsl(${i*17} 5% ${8+i%4*5}%)`);f.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>`;d.append(f);d.onclick=()=>{a=i;draw()};c.append(d);let q=document.createElement('div');q.textContent=name;q.onclick=()=>{a=i;draw()};l.append(q)});function draw(){root.style.setProperty('--a',a);document.querySelectorAll('.card').forEach((x,i)=>x.classList.toggle('on',i===a));document.querySelectorAll('.list div').forEach((x,i)=>x.classList.toggle('on',i===a))}function step(v){a=(a+v+12)%12;draw()}addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false});addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});addEventListener('pointerdown',e=>{down=1;x=e.clientX;s=a});addEventListener('pointerup',e=>{if(down&&Math.abs(e.clientX-x)>40)step(e.clientX<x?1:-1);down=0});draw()</script></body></html>
